<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Threads 貼文數據監控儀表板</title>
    <link rel="stylesheet" href="style.css?v=2">
    <!-- 引入 Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- 引入前端互動邏輯 -->
    <script src="app.js?v=2" defer></script>
</head>
<body>
    <div class="background-glow bg-glow-1"></div>
    <div class="background-glow bg-glow-2"></div>
    <div class="background-glow bg-glow-3"></div>

    <div class="app-container">
        <!-- 平臺切換分頁導覽 -->
        <div class="platform-tabs animate-fade-in">
            <button class="platform-tab active" id="tabThreads" type="button" onclick="switchPlatform('threads')">
                <span class="tab-icon">🧵</span>
                <span class="tab-title">Threads 貼文分析</span>
            </button>
            <button class="platform-tab" id="tabDcard" type="button" onclick="switchPlatform('dcard')">
                <span class="tab-icon">🍃</span>
                <span class="tab-title">Dcard 文章分析</span>
            </button>
        </div>

        <!-- 頂部標題區 -->
        <header class="header animate-fade-in">
            <div class="logo" id="appLogo">
                <!-- Threads Logo SVG Icon -->
                <svg viewBox="0 0 24 24" width="32" height="32" class="threads-logo">
                    <path fill="currentColor" d="M12 24c-6.627 0-12-5.373-12-12S5.373 0 12 0s12 5.373 12 12-5.373 12-12 12zm0-2c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10zm2-14.5c0-.828-.672-1.5-1.5-1.5S11 6.672 11 7.5V11h-3.5C6.672 11 6 11.672 6 12.5S6.672 14 7.5 14H11v3.5c0 .828.672 1.5 1.5 1.5s1.5-.672 1.5-1.5V14h3.5c.828 0 1.5-.672 1.5-1.5s-.672-1.5-1.5-1.5H14V7.5z" style="display: none;"/>
                    <path fill="currentColor" d="M16.792 11.838c-.378-.06-.757-.107-1.14-.14-.265-.957-.75-1.85-1.428-2.613.567-.425 1.258-.696 2.023-.746.216.772.392 1.636.545 2.5zm-5.01-4.887c.22-.016.44-.025.666-.025.753 0 1.48.11 2.164.316-.275.76-.632 1.488-1.05 2.146a4.42 4.42 0 0 0-1.78-2.437zM12.448 17c-.226 0-.447-.01-.667-.026-.807-.052-1.545-.357-2.128-.846.332-.782.784-1.503 1.332-2.14 1.15.228 2.054.673 2.658 1.312a3.844 3.844 0 0 1-1.2 1.7zm1.884.286c-.573.473-1.25.76-1.99.82a8.88 8.88 0 0 1-1.042.06c-1.86 0-3.32-.472-4.34-1.405C7.933 15.827 7.42 14.542 7.42 12.91c0-1.632.513-2.917 1.54-3.85C9.98 8.127 11.44 7.655 13.3 7.655c.742 0 1.41.088 1.99.262.58.175 1.056.44 1.428.8a5.1 5.1 0 0 1 1.037 1.547c.28.66.42 1.42.42 2.277v1.895c0 .736.216 1.104.647 1.104.223 0 .463-.122.716-.367a7.288 7.288 0 0 0 1.257-1.89c.143-.332.32-.395.532-.19l.568.553c.18.174.22.378.12.612a8.47 8.47 0 0 1-1.802 2.637 4.122 4.122 0 0 1-2.946 1.1c-.812 0-1.458-.225-1.936-.675-.478-.45-.717-1.062-.717-1.837v-1.895c0-.62-.1-1.16-.3-1.62-.2-.46-.5-.815-.9-1.065-.4-.25-.9-.375-1.5-.375-.615 0-1.127.126-1.536.377-.41.25-.718.608-.925 1.073-.207.465-.31 1.008-.31 1.63 0 .62.103 1.163.31 1.63.207.465.515.823.925 1.073.41.25.92.377 1.536.377.388 0 .762-.05 1.12-.152-.162.296-.347.58-.553.85a5.55 5.55 0 0 1-1.423.858c-.53.22-1.11.332-1.742.332-1.282 0-2.285-.327-3.007-.98-.723-.655-1.085-1.576-1.085-2.766s.362-2.11 1.085-2.765c.722-.654 1.725-.98 3.007-.98.812 0 1.52.122 2.124.367.604.245 1.087.61 1.45 1.096a6.046 6.046 0 0 1 .904 1.72 6.782 6.782 0 0 1 .288 2.054c0 1.036-.316 1.847-.948 2.433z"/>
                </svg>
            </div>
            <h1 id="appTitle">Threads <span>貼文數據查詢監控</span></h1>
            <p id="appSubtitle" class="subtitle">輸入 Threads 貼文網址，即時分析曝光、互動與讚數統計</p>
        </header>

        <!-- 網址輸入面板 -->
        <main class="main-card animate-slide-up">
            <div class="input-section">
                <!-- 動態增加的輸入框容器 -->
                <div id="urlInputsContainer" class="inputs-container">
                    <!-- JavaScript 會在載入時動態填入第一個輸入框 -->
                </div>
                
                <div class="input-actions-row">
                    <button id="addInputBtn" class="btn-secondary add-btn" type="button">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        新增貼文網址
                    </button>
                </div>

                <button id="submitBtn" onclick="queryBatchMetrics()" class="btn-primary">
                    <span class="btn-text">開始分析數據</span>
                    <div class="btn-loader"></div>
                </button>
            </div>

            <!-- 錯誤提示區 (全域級) -->
            <div id="errorMessage" class="error-banner hidden">
                <span class="error-icon">⚠️</span>
                <span id="errorText" class="error-text">錯誤訊息</span>
            </div>

            <!-- 數據分析結果與貼文預覽卡片列表 -->
            <div id="resultContainer" class="result-container hidden">
                <h2 class="section-title">📊 數據分析與預覽結果</h2>
                
                <!-- 動態生成的結果列表容器 -->
                <div id="resultsList" class="results-list"></div>

                <div class="action-footer" style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
                    <button id="copyTableBtn" class="btn-primary" onclick="copyBatchResultsTable()">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="3" y1="9" x2="21" y2="9"></line>
                            <line x1="9" y1="21" x2="9" y2="9"></line>
                        </svg>
                        複製為 PPT / Excel 表格
                    </button>
                    <button id="copyJsonBtn" class="btn-secondary" onclick="copyBatchResultsJSON()">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                        複製為 JSON 數據
                    </button>
                </div>
            </div>
        </main>
        
        <!-- 頁尾說明 -->
        <footer class="app-footer">
            <p>本工具專為本地個人使用設計。數據爬取依賴 Playwright 瀏覽器渲染，部分帳號未公開或頻繁查詢可能受限。</p>
            <p>© 2026 Threads Metric Monitor Tool.</p>
        </footer>
    </div>
</body>
</html>
